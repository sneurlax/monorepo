# Generated by monorepo 0.2.0: monorepo ci
# The commands match `monorepo plan --lines`. Regenerate this when members
# change; `monorepo check` reports drift.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DASH__SUPPRESS_ANALYTICS: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Resolve dependencies
        run: dart pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output none --set-exit-if-changed packages/greeting/lib packages/greeting/test packages/greeting_cli/bin packages/greeting_cli/lib packages/greeting_cli/test packages/greeting/example/bin
      - name: Analyze
        run: dart analyze packages/greeting packages/greeting_cli
      - name: Test greeting
        working-directory: packages/greeting
        run: dart test
      - name: Test greeting_cli
        working-directory: packages/greeting_cli
        run: dart test
      # skip packages/greeting/example: no test/ directory
